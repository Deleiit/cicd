name: Close Pull Request

on:
  pull_request_target:
    types: [opened]
    branches:
      - 'release/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: superbrothers/close-pull-request@v3
      if: github.head_ref != 'main' && !startsWith(github.head_ref, 'bug/')
      with:
        comment: "PR fermée automatiquement, les merge vers les branches release/* doivent avoir main ou bug/* comme base"