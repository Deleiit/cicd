name: Commentaire dans une PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  commentairedansunepr:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher un message dans les logs
        run: echo "Un message dans les logs"

      - name: Checkout le repository
        uses: actions/checkout@v7

      - name: Ajouter ls -lrath
        uses: ls -lrath

      - name: Publier le README.md du repository comme commentaire sur la PR qui a déclenché le workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file README.md