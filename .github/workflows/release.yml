name: Branche release

on:
  pull_request:
    branches:
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: simeis-class

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Contrôles de développement (check et tests)
        run: |
          make check
          make clippy
          make fmt
          make test