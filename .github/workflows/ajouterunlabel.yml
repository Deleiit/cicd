name: Ajouter un label

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  ajouterunlabel:
    runs-on: ubuntu-latest
    steps:
      - name: Créer un workflow qui ajoute un label bigdiff si le nombre de lignes modifiées par la PR dépasse les 1000 lignes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(({{ github.event.pull_request.additions }} + {{ github.event.pull_request.deletions }}))
          if [ $TOTAL -gt 1000 ]; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label bigdiff
          fi